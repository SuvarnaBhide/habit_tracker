<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD List</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">&#9632;</div>
        <h1>MY LIST</h1>
        <p class="subtitle">add · edit · delete</p>
      </header>

      <div class="input-row">
        <input
          type="text"
          id="titleInput"
          placeholder="Enter a title..."
          autocomplete="off"
        />
        <button id="addBtn" onclick="addItem()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add
        </button>
      </div>

      <ul id="itemList"></ul>

      <p class="empty-state" id="emptyState">
        Nothing here yet. Add something above.
      </p>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <h2>Edit Item</h2>
        <input type="text" id="editInput" placeholder="Update title..." />
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="saveEdit()">Save</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
