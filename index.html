<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Bloom · Habit Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <span class="eyebrow">bloom · habit tracker</span>
        <h1>My <em>Habits</em></h1>
      </header>

      <div class="card input-card">
        <input
          type="text"
          id="habitInput"
          placeholder="Add a new habit…"
          autocomplete="off"
          autocorrect="off"
        />
        <button id="addBtn" onclick="addHabit()" aria-label="Add habit">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add
        </button>
      </div>

      <div id="habitList"></div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🌿</div>
        <p>No habits yet.<br />Build something worth keeping.</p>
      </div>
    </div>

    <!-- Day picker -->
    <div class="picker-overlay" id="pickerOverlay">
      <div class="picker" onclick="event.stopPropagation()">
        <p class="picker-title" id="pickerTitle"></p>
        <div class="picker-options">
          <button class="pick-btn pick-done" onclick="setPick('done')">
            <span class="pick-circle"></span>Done
          </button>
          <button class="pick-btn pick-warn" onclick="setPick('warn')">
            <span class="pick-circle"></span>Partial
          </button>
          <button class="pick-btn pick-miss" onclick="setPick('miss')">
            <span class="pick-circle"></span>Missed
          </button>
          <button class="pick-btn pick-skip" onclick="setPick('skip')">
            <span class="pick-circle"></span>Skip
          </button>
          <button class="pick-btn pick-clear" onclick="setPick('empty')">
            Clear
          </button>
        </div>
      </div>
    </div>

    <!-- Edit modal -->
    <div class="modal-overlay" id="editOverlay" role="dialog" aria-modal="true">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeEdit()" aria-label="Close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
        <p class="modal-label">Edit habit</p>
        <input type="text" id="editInput" placeholder="Update habit name…" />
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
          <button class="btn-save" onclick="saveEdit()">Save</button>
        </div>
      </div>
    </div>

    <!-- Delete confirm modal -->
    <div
      class="modal-overlay"
      id="deleteOverlay"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeDelete()" aria-label="Close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
        <p class="modal-label delete-label">Are you sure?</p>
        <div class="delete-body">
          <div class="delete-icon">🗑️</div>
          <p class="delete-question">You're about to delete</p>
          <p class="delete-item-name" id="deleteHabitName"></p>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeDelete()">Keep it</button>
          <button class="btn-confirm-delete" onclick="confirmDelete()">
            Yes, delete
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
